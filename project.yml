name: VocabApp
options:
  bundleIdPrefix: com.atharvanayak
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: YES
    SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  VocabApp:
    type: application
    platform: iOS
    configFiles:
      Debug: Config/Shared.xcconfig
      Release: Config/Shared.xcconfig
    sources:
      - path: VocabApp
        excludes:
          - "**/.gitkeep"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.atharvanayak.vocabapp
        PRODUCT_NAME: VocabApp
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations~ipad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_WORDNIK_API_KEY: $(WORDNIK_API_KEY)

  VocabAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: VocabAppTests
        excludes:
          - "**/.gitkeep"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.atharvanayak.vocabapptests
        PRODUCT_NAME: VocabAppTests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: VocabApp

schemes:
  VocabApp:
    build:
      targets:
        VocabApp: all
        VocabAppTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - VocabAppTests
    archive:
      config: Release
